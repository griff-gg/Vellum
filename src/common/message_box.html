<rml>
    <head>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
        <link type="text/rcss" href="../styles/item_slot.css" />

        <style>
            #common-message-box
            {
                display: inline-block;
                width: auto;
                min-width: 260dp;
                font-size: 13dp;
            }

            #window-content
            {
                padding: 6dp;
                width: auto;
                height: auto;
                gap: 6dp;

                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
            }

            #content {
                /* Preserve fractional text height instead of flex pixel snapping. */
                display: block;
                width: 248dp;
            }

            #content > div {
                width: 100%;
                display: flex;
                justify-content: center;
            }
            
            #icon-container {
                display: flex;
                flex-wrap: wrap;
                justify-content: center;
                gap: 4dp;
            }

            #icon-container > icon,
            #icon-container > item-slot {
                margin-bottom: 6dp;
            }

            #input-container > input {
                width: 100%;
                height: 24dp;
                padding: 1dp 5dp;
                margin-top: 6dp;
                font-size: 13dp;
            }

            #button-container {
                display: flex;
                justify-content: center;
                gap: 4dp;
                width: auto;
            }

            #button-container > button.default {
                min-width: 64dp;
                height: 24dp;
                flex-shrink: 0;
                padding: 0dp 7dp;
                line-height: 22dp;
                white-space: nowrap;
            }

            #time-remaining-text {
                white-space: nowrap;
            }

            #time-remaining-icon {
                width: 24dp;
                height: 24dp;
                margin-right: 4dp;
            }

            #content > #message-container {
                display: block;
                max-height: 50vh;
                overflow-y: auto;
                text-align: center;
            }
            
            #message
            {
                display: block;
                word-break: break-word;
                font-weight: bold;
                font-effect: outline(1dp black);
            }

            #message.plain
            {
                white-space: pre-wrap;
            }

            #cancel
            {
                color: rgb(255, 211, 211);
            }

            progress {
                display: block;
                height: 5dp;
                width: 125dp;
            }

            .horizontal {
                background: rgba(134, 134, 134, 191);
            }

            .horizontal fill {
                background-color: rgb(255, 211, 211);
            }
        </style>
    <style>
@keyframes gl-open-a { 0% { opacity: 0; transform: translateY(5dp) scale(0.985); } 100% { opacity: 1; transform: translateY(0dp) scale(1); } }
@keyframes gl-open-b { 0% { opacity: 0; transform: translateY(5dp) scale(0.985); } 100% { opacity: 1; transform: translateY(0dp) scale(1); } }
</style>
<script>
-- Glass: each time the window opens it fades and settles in, then a streak of light crosses the glass.
-- Two identical keyframe sets (-a / -b): switching to the other one restarts the animation.
pcall(function()
    local doc = document
    local flip = false
    local function opened()
        flip = not flip
        doc:SetClass('gl-shown-a', flip)
        doc:SetClass('gl-shown-b', not flip)
        doc.style.animation = '0.15s cubic-out 1 ' .. (flip and 'gl-open-a' or 'gl-open-b')
    end
    doc:AddEventListener('show', function() pcall(opened) end)
    opened()
end)
</script>
</head>

    <!-- Each message box instance attaches this document to its own data model. -->
    <body id="common-message-box" class="window-fixed-size" onkeyup="keyup">
        <handle class="window-title" move_target="#document" id="window-title-text">&nbsp;</handle>

        <div id="window-content">
            <div id="content">
                <div id="icon-container">
                    <icon data-if="icon_class != ''" data-attr-class="icon_class" />
                </div>
                <div id="message-container"><label id="message" data-rml="message" data-class-plain="plain_text"></label></div>
                <div id="input-container"></div>
            </div>
            <div id="timer-container" data-if="timer_visible">
                <span style="display: flex; flex-direction: row; align-items: center;">
                    <img id="time-remaining-icon" data-attr-sprite="timer_warning ? 'timer-clock-warning' : 'timer-clock'" />
                    <span>
                        <div id="time-remaining-text">{{ seconds_remaining }} seconds remaining.</div>
                        <progress id="time-remaining-progress" class="horizontal" data-attr-value="timer_value" data-attr-max="timer_max" />
                    </span>
                </span>
            </div>
            <div id="button-container" data-if="confirm_visible || cancel_visible">
                <button class="default" id="confirm" onclick="confirm" data-if="confirm_visible" data-attrif-disabled="!input_valid"><str data-attr-legacy-text="confirm_label" /></button>
                <button class="default" id="cancel" onclick="cancel" data-if="cancel_visible"><str data-attr-legacy-text="cancel_label" /></button>
            </div>
        </div>
    </body>
</rml>
