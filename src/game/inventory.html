            body { width: 267dp; max-width: 95vw; }
            #inventory-window #window-content { padding: 6dp; max-height: none; overflow: visible; }
            #inventory-window > .window-title { width: 76dp; font-size: 13dp; }
            .inventory-mode-tabs { display: flex; position: absolute; top: 2dp; right: 30dp; width: 164dp; height: 23dp; z-index: 1; }
            .inventory-mode-tabs > .inventory-tab { height: 23dp; line-height: 19dp; padding: 1dp 2dp; font-size: 12dp; background-color: transparent; border: 0dp transparent; border-bottom: 2dp transparent; border-radius: 0dp; }
            .inventory-mode-tabs > .inventory-tab:hover { background-color: rgba(85, 40, 34, 100); }
            .inventory-mode-tabs > .inventory-tab.selected { border-bottom-color: rgb(190, 64, 53); }
            .inventory-bag-label { flex: 1; height: 24dp; line-height: 24dp; padding-left: 4dp; font-size: 13dp; font-weight: 820; color: rgb(255, 112, 102); }
            .equipment-pane { position: relative; width: 255dp; height: 133dp; margin: 0 auto 4dp; }
            /* Align the 40dp slots with the bag while retaining the padded equipment artwork. */
            .equipment-cell { position: absolute; width: 40dp; height: 43dp; }
            .equipment-cell > img { position: absolute; left: -2dp; width: 43dp; height: 43dp; pointer-events: none; }
            .equipment-cell item-slot { position: absolute; top: 2dp; left: 0dp; width: 40dp; height: 40dp; }
            .equipment-cell.filled > img { visibility: hidden; }
            /* Explicit six-slot rows keep fractional UI scales from wrapping a column. */
            .bag-grid { width: 100%; flex-direction: column; flex-wrap: nowrap; gap: 3dp; }
            .bag-row { display: flex; flex-wrap: nowrap; gap: 3dp; }
            .bag-row > .bag-cell { width: 40dp; height: 40dp; flex: 0 0 40dp; }
            .inventory-footer { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4dp; margin-top: 4dp; padding-top: 4dp; padding-right: 2dp; padding-bottom: 2dp; }
            .inventory-footer .ui-currency { flex-shrink: 0; font-size: 12dp; }
            .inventory-footer .ui-currency > img, .inventory-footer .ui-currency > button.zulie { position: relative; top: 1dp; }
            .inventory-footer .ui-currency > span { position: relative; top: 2dp; white-space: nowrap; word-break: normal; }
            #inventory-zulie { margin-left: auto; }
            #inventory-weight { color: rgb(0, 210, 255); }
            #inventory-weight.overweight { color: rgb(255, 100, 100); }
            .vehicle-stats { position: absolute; top: 49dp; left: 0; right: 0; font-size: 12dp; }
            .vehicle-stat { display: inline-flex; justify-content: space-between; width: 48%; margin-right: 2%; line-height: 19dp; }
            .vehicle-stat span { color: rgb(255, 247, 191); }
            #inventory-operation { color: rgb(255, 247, 191); font-size: 12dp; margin-bottom: 8dp; }

            /* ===== Glass. The game draws no CSS box-shadow (broken: white box + copy at screen 0,0), filter, backdrop-filter or linear-gradient. ===== */
            /* the frame image carries the tint, rim, sheen and shadow; 12dp of it around the glass is shadow room */
            body#inventory-window {
                width: 263dp;
                padding: 50dp 20dp 20dp 20dp;
                background-color: transparent;
                border-width: 0dp;
                decorator: tiled-box(gl-win-tl, gl-win-t, gl-win-tr, gl-win-l, gl-win-c, gl-win-r, gl-win-bl, gl-win-b, gl-win-br);
                color: rgb(245, 247, 250);
            }
            body#inventory-window #window-content { decorator: none; background-color: transparent; border-width: 0dp; padding: 0dp 4dp; }
            /* quiet title: small, wide-spaced capitals */
            body#inventory-window > .window-title {
                top: 21dp; left: 12dp; width: 94dp; padding-left: 14dp;
                line-height: 24dp; font-size: 10dp; font-weight: 800;
                text-transform: uppercase; letter-spacing: 1.6dp;
                color: rgba(255, 255, 255, 215); font-effect: shadow(0dp 1dp rgba(0,0,0,120));
            }
            body#inventory-window > button.window-title-close,
            body#inventory-window > button.window-title-close:hover,
            body#inventory-window > button.window-title-close:active {
                top: 23dp; right: 22dp; width: 20dp; height: 20dp; min-width: 20dp; padding: 0dp;
                box-sizing: border-box;
                decorator: none; background-color: rgba(255,255,255,40);
                border: 1dp rgba(255,255,255,90); border-radius: 10dp;
                text-align: center; line-height: 17dp; font-size: 14dp; font-weight: 700;
                color: rgba(255,255,255,220); font-effect: none;

            body#inventory-window > button.window-title-close span { pointer-events: none; }

            /* segmented controls (top mode tabs + bag tabs) */
            body#inventory-window .inventory-mode-tabs,

                background-color: transparent; border-width: 0dp;

            }

            body#inventory-window #inventory-bag-tabs { position: relative; height: 26dp; margin: 2dp 0dp 8dp 0dp; border-radius: 13dp; }
            body#inventory-window .inventory-tab,

                border-width: 0dp; font-effect: none;
                color: rgba(255,255,255,170);
                position: relative;
                transition: background-color 0.2s cubic-out, color 0.2s cubic-out, border-color 0.2s cubic-out, transform 0.2s cubic-out, opacity 0.2s cubic-out;
            }
            body#inventory-window .inventory-mode-tabs > .inventory-tab { height: 16dp; line-height: 16dp; font-size: 11dp; border-radius: 8dp; }
            body#inventory-window #inventory-bag-tabs > .inventory-tab { height: 20dp; line-height: 20dp; font-size: 12dp; border-radius: 10dp; }
            body#inventory-window .inventory-tab:hover { color: white; background-color: rgba(255,255,255,22); }
            body#inventory-window .inventory-tab.selected {
                color: rgb(255,255,255);
                background-color: transparent;
                border-width: 0dp;
            }

            /* the glass pill slides under the selected tab (tabs paint above it: position relative, later in the page).
               div.gl-rail = the tabs' area (3dp in from the track edge), the pill is exactly one tab of it. */
            body#inventory-window .gl-rail { position: absolute; top: 3dp; left: 3dp; right: 3dp; pointer-events: none; }
            body#inventory-window .gl-slider {
                position: absolute; top: 0dp; left: 0%; width: 33.333%;
                decorator: tiled-box(gl-pill-tl, gl-pill-t, gl-pill-tr, gl-pill-l, gl-pill-c, gl-pill-r, gl-pill-bl, gl-pill-b, gl-pill-br);
                transition: left 0.28s cubic-out;
                pointer-events: none;
            }
            body#inventory-window .gl-slider.at1 { left: 33.333%; }
            body#inventory-window .gl-slider.at2 { left: 66.667%; }
            body#inventory-window .inventory-mode-tabs > .gl-rail, body#inventory-window .inventory-mode-tabs .gl-slider { height: 16dp; }
            body#inventory-window #inventory-bag-tabs > .gl-rail, body#inventory-window #inventory-bag-tabs .gl-slider { height: 20dp; }
            body#inventory-window .inventory-bag-label { color: white; text-align: center; line-height: 20dp; height: 20dp; }

            body#inventory-window .bag-row > .bag-cell {

            body#inventory-window #inventory-weight { color: rgb(100, 210, 255); }
            body#inventory-window #inventory-zulie { color: rgb(255, 255, 255); }


            /* open: fade + settle (glass_open.lua starts it on every show) */
            body#inventory-window { transform-origin: 50% 0% 0; }
            @keyframes gl-open-a { 0% { opacity: 0; transform: translateY(5dp) scale(0.985); } 100% { opacity: 1; transform: translateY(0dp) scale(1); } }
            @keyframes gl-open-b { 0% { opacity: 0; transform: translateY(5dp) scale(0.985); } 100% { opacity: 1; transform: translateY(0dp) scale(1); } }

        </style>
        <script>
-- Glass: each time the window opens it fades and settles in, then a streak of light crosses the glass.
-- Two identical keyframe sets (-a / -b): switching to the other one restarts the animation.
pcall(function()
    local doc = document
    local flip = false
    local function opened()
        flip = not flip
        doc:SetClass('gl-shown-a', flip)
        doc:SetClass('gl-shown-b', not flip)
        doc.style.animation = '0.15s cubic-out 1 ' .. (flip and 'gl-open-a' or 'gl-open-b')
    end
    doc:AddEventListener('show', function() pcall(opened) end)
    opened()
end)
        </script>
