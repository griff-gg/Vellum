<rml>
    <head>
        <title>Scoreboard</title>

        <link type="text/template" href="../templates/window-fixed-size.html" />

        <style>
            body {
                width: 1065dp;
                height: 580dp;
            }

            #scoreboard {
                padding-left: 10dp;
                width: 1050dp;
            }

            #headers {
                display: flex;
                height: 36dp;
                text-align: center;
                color: #e6b903;
                font-weight: bold;
                margin-bottom: 15dp;
            }

            #headers-left {
                width: 235dp; /* 150dp col + 85dp col */
                flex: none;
            }

            #headers-center {
                display: flex;
                overflow-x: hidden;
                max-width: 680dp; /* 85dp x 8 cols */
            }

            #headers-right {
                flex: none;
            }

            #data-container {
                overflow-y: scroll;
                height: 475dp;
            }

            #data {
                display: flex;
                text-align: center;
                padding-bottom: 10dp;
            }

            #data-left {
                width: 235dp; /* 150dp col + 85dp col */
                display: flex;
                flex-direction: column;
                flex: none;
            }

            #data-left:first-child > span {
                text-align: left;
            }

            #data-center {
                overflow-x: auto;
                height: 460dp;
                max-width: 680dp; /* 85dp x 8 cols */
            }

            /* Flex descendants snap separately; keep one physical pixel of fit space. */
            #headers-center, #data-center { padding-right: 1px; }

            #data-right {
                flex: none;
            }

            .header-row {
                height: 36dp;
                display: flex;
                vertical-align: center;
            }

            .data-row {
                display: flex;
                flex-direction: row;
                vertical-align: middle;
                height: 28dp;
            }

            .data-row-selected {
                background-color: rgba(230, 185, 3, 70);
            }

            .header-val,
            .data-val {
                height: auto;
                width: 85dp;
                margin: 0;
                padding: 0;
                flex-shrink: 0;
            }

            .data-val-wide,
            .header-val-wide {
                width: 150dp;
                text-align: left;
            }

            .header-val span,
            .data-val span {
                vertical-align: center;
            }

            .header-val:hover {
                cursor: hand;
                color: #f7d75a;
            }

            hr {
                opacity: 0.2;
                width: 100%;
                color: #222;
                margin: auto;
            }

            #teams {
                margin-top: 5dp;
                margin-bottom: 15dp;
            }

            #teams > .ui-tab {
                flex: none;
                padding-left: 15dp;
                padding-right: 15dp;
            }
        </style>
    <style>
@keyframes gl-open-a { 0% { opacity: 0; transform: translateY(5dp) scale(0.985); } 100% { opacity: 1; transform: translateY(0dp) scale(1); } }
@keyframes gl-open-b { 0% { opacity: 0; transform: translateY(5dp) scale(0.985); } 100% { opacity: 1; transform: translateY(0dp) scale(1); } }
</style>
<script>
-- Glass: each time the window opens it fades and settles in, then a streak of light crosses the glass.
-- Two identical keyframe sets (-a / -b): switching to the other one restarts the animation.
pcall(function()
    local doc = document
    local flip = false
    local function opened()
        flip = not flip
        doc:SetClass('gl-shown-a', flip)
        doc:SetClass('gl-shown-b', not flip)
        doc.style.animation = '0.15s cubic-out 1 ' .. (flip and 'gl-open-a' or 'gl-open-b')
    end
    doc:AddEventListener('show', function() pcall(opened) end)
    opened()
end)
</script>
</head>
    <body id="ui_gamearena_scoreboard" template="window-fixed-size">
        <!-- Content-->
        <div id="scoreboard" data-model="gamearena_scoreboard_data">
            <!-- Teams -->
            <div id="teams" class="ui-tab-strip">
                <tab
                    class="ui-tab"
                    index="-1"
                    data-class-selected="selected_team_id == -1"
                    onclick="scoreboard_select_team"
                >
                    <str string-id="1068">All</str>
                </tab>
                <tab
                    class="ui-tab"
                    data-for="team: teams"
                    data-attr-index="team.id"
                    data-class-selected="selected_team_id == team.id"
                    onclick="scoreboard_select_team"
                >
                    {{ team.name }}
                </tab>
            </div>

            <!-- Headers-->
            <div id="headers">
                <div id="headers-left" class="header-row">
                    <div
                        class="header-val"
                        data-class-header-val-wide="header_idx == 0"
                        data-for="header, header_idx: headers_left"
                        data-attr-index="header.col_idx"
                        onclick="scoreboard_sort"
                    >
                        <span>{{ header.name }}</span>
                    </div>
                </div>
                <sticky-scroll
                    id="headers-center"
                    class="header-row"
                    target="#data-center"
                    sync-scroll-left="true"
                >
                    <div
                        class="header-val"
                        data-for="header, header_idx: headers_center"
                        data-attr-index="header.col_idx"
                        onclick="scoreboard_sort"
                    >
                        <span>{{ header.name }}</span>
                    </div>
                </sticky-scroll>
                <div id="headers-right" class="header-row">
                    <div
                        class="header-val"
                        data-for="header, header_idx: headers_right"
                        data-attr-index="header.col_idx"
                        onclick="scoreboard_sort"
                    >
                        <span>{{ header.name }}</span>
                    </div>
                </div>
            </div>

            <hr />

            <!-- Data-->
            <div id="data-container">
                <div id="data">
                    <div id="data-left">
                        <div
                            class="data-row"
                            data-for="data: scores_left"
                            data-if="selected_team_id == -1 || data.team_id == selected_team_id"
                            data-class-data-row-selected="data.highlight"
                        >
                            <div
                                class="data-val"
                                data-class-data-val-wide="it_index == 0"
                                data-for="score: data.scores"
                            >
                                <span>{{ score }}</span>
                            </div>
                        </div>
                    </div>
                    <sticky-scroll
                        id="data-center"
                        target="#data-container"
                        sticky-top="true"
                        sync-scroll-top="true"
                    >
                        <div
                            class="data-row"
                            data-for="data: scores_center"
                            data-if="selected_team_id == -1 || data.team_id == selected_team_id"
                        >
                            <div
                                class="data-val"
                                data-for="score: data.scores"
                                data-class-data-row-selected="data.highlight"
                            >
                                <span>{{ score }}</span>
                            </div>
                        </div>
                    </sticky-scroll>
                    <div id="data-right">
                        <div
                            class="data-row"
                            data-for="data: scores_right"
                            data-if="selected_team_id == -1 || data.team_id == selected_team_id"
                            data-class-data-row-selected="data.highlight"
                        >
                            <div class="data-val" data-for="score: data.scores">
                                <span>{{ score }}</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>
</rml>
