<rml>
    <head>
        <title>Private Chat</title>

        <link type="text/template" href="../templates/window-resizeable.html" />

        <style>
            #game-private-chat
            {
                width: 215dp;
                height: 205dp;
                min-width: 175dp;
                min-height: 50dp;
            }

            #virtual-messages
            {
                display: block;
                word-break: break-word;
                font-effect: outline(1dp black);
                overflow: hidden scroll;
            }

            .chat-message
            {
                margin: 0dp 0dp;
            }

            .chat-message-from:hover
            {
                text-decoration: underline;
            }

            .chat-message-link:hover
            {
                text-decoration: underline;
            }

            .timestamp
            {
                color: #a0a0a0;
            }

            .chat-message-chat
            {
                color: #ffffff;
            }
        </style>
    <style>
@keyframes gl-open-a { 0% { opacity: 0; transform: translateY(5dp) scale(0.985); } 100% { opacity: 1; transform: translateY(0dp) scale(1); } }
@keyframes gl-open-b { 0% { opacity: 0; transform: translateY(5dp) scale(0.985); } 100% { opacity: 1; transform: translateY(0dp) scale(1); } }
</style>
<script>
-- Glass: each time the window opens it fades and settles in, then a streak of light crosses the glass.
-- Two identical keyframe sets (-a / -b): switching to the other one restarts the animation.
pcall(function()
    local doc = document
    local flip = false
    local function opened()
        flip = not flip
        doc:SetClass('gl-shown-a', flip)
        doc:SetClass('gl-shown-b', not flip)
        doc.style.animation = '0.15s cubic-out 1 ' .. (flip and 'gl-open-a' or 'gl-open-b')
    end
    doc:AddEventListener('show', function() pcall(opened) end)
    opened()
end)
</script>
</head>

    <body open-sound="3" close-sound="4" id="game-private-chat" template="window-resizeable">
        <div style="width: 100%; height: 100%; display: flex; flex-direction: column;">
            <virtual-list-box id="virtual-messages" style="flex: 1"></virtual-list-box>
            <input id="input_text" type="text" maxlength="250" retains-focus autofocus />
        </div>
    </body>
</rml>
