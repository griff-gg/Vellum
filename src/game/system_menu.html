<rml>
    <head>
        <title>System Menu</title>

        <link type="text/template" href="../templates/window-fixed-size.html" />

        <style>
            body {
                width: 148dp;
                font-size: 13dp;
                font-effect: outline(1dp black);
            }

            #window-title-text {
                height: 24dp;
                padding-right: 28dp;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
            }

            #window-content {
                display: flex;
                flex-direction: column;
                gap: 2dp;
                height: auto;
                padding: 4dp 3dp;
            }

            button.default {
                width: 100%;
                min-width: 0;
                height: 24dp;
                flex-shrink: 0;
                padding: 0dp 3dp;
                line-height: 22dp;
                white-space: nowrap;
            }
        </style>
    <style>
@keyframes gl-open-a { 0% { opacity: 0; transform: translateY(5dp) scale(0.985); } 100% { opacity: 1; transform: translateY(0dp) scale(1); } }
@keyframes gl-open-b { 0% { opacity: 0; transform: translateY(5dp) scale(0.985); } 100% { opacity: 1; transform: translateY(0dp) scale(1); } }
</style>
<script>
-- Glass: each time the window opens it fades and settles in, then a streak of light crosses the glass.
-- Two identical keyframe sets (-a / -b): switching to the other one restarts the animation.
pcall(function()
    local doc = document
    local flip = false
    local function opened()
        flip = not flip
        doc:SetClass('gl-shown-a', flip)
        doc:SetClass('gl-shown-b', not flip)
        doc.style.animation = '0.15s cubic-out 1 ' .. (flip and 'gl-open-a' or 'gl-open-b')
    end
    doc:AddEventListener('show', function() pcall(opened) end)
    opened()
end)
</script>
</head>

    <body id="game-system-menu" open-sound="3" close-sound="4" template="window-fixed-size">
        <button class="default" onclick="open-options">Options</button>
        <button class="default" onclick="open-support">Support</button>
        <button class="default" onclick="character-select">Character Select</button>
        <button class="default" onclick="logout">Logout</button>
    </body>
</rml>
