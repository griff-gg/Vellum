<rml>
<head>
    <title>Item Mall</title>
    <link type="text/template" href="../templates/window-fixed-size.html" />
    <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
    <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
    <link type="text/rcss" href="../styles/item_slot.css" />
    <link type="text/rcss" href="../styles/spritesheet_overlayicon.css" />
    <link type="text/rcss" href="../styles/components.css" />
    <link type="text/rcss" href="item_mall.css" />
    <script src="/data/ui/themes/rose/game/item_mall.lua" />
</head>
<body open-sound="3" close-sound="4" id="item-mall" template="window-fixed-size">
    <div id="mall-balance" class="ui-currency content-box"><img sprite="mall-points" /><b id="mall-points">0</b><span>PTS</span></div>
    <div id="mall-shell">
        <div id="mall-toolbar">
            <input id="mall-search" type="text" maxlength="100" placeholder="Search the mall..." />
            <div class="mall-segments ui-tab-strip">
                <button id="mall-sort-featured" class="ui-tab active" data-sort="featured" mall-tooltip="Seasonal first, then curated order">Recommended</button>
                <button id="mall-sort-name" class="ui-tab" data-sort="name" mall-tooltip="Sort Alphabetically">A–Z</button>
            </div>
            <div class="mall-segments mall-layout ui-tab-strip">
                <button id="mall-grid" class="ui-tab active" data-layout="grid" mall-tooltip="Grid View"><span class="mall-grid-glyph"><i/><i/><i/><i/></span></button>
                <button id="mall-list" class="ui-tab" data-layout="list" mall-tooltip="List View"><span class="mall-list-glyph"><i/><i/><i/></span></button>
            </div>
        </div>
        <div id="mall-body">
            <div id="mall-sidebar">
                <div id="mall-nav" />
                <button id="mall-purchases-side" class="default" onclick="purchases" aria-expanded="false" mall-tooltip="Open or close your purchased items"><span>Purchases</span></button>
                <div id="mall-premium-card" class="content-box">
                    <b id="mall-premium-title">ROSE Premium</b>
                    <div id="mall-premium-copy">More character slots. Extra storage. Storage access anywhere.</div>
                    <button id="mall-premium-link" class="default ui-compact" data-premium="open">View benefits</button>
                </div>
            </div>
            <div id="mall-catalog">
                <div id="mall-heading"><b id="mall-path">Monthly</b><span id="mall-count" /></div>
                <div id="mall-premium-banner" class="content-box">
                    <b>More to explore with ROSE Premium</b>
                    <div>5 extra character slots, Premium Storage, and Remote Storage for every character on your account.</div>
                    <button class="default ui-compact" data-premium="open">Explore Premium</button>
                </div>
                <div id="mall-state" class="ui-status" />
                <div id="mall-items-area">
                    <div id="mall-items" />
                    <button id="mall-more" class="default ui-compact" mall-tooltip="Scroll down to see more items">&#9660; More items below</button>
                </div>
            </div>
            <div id="mall-detail" class="content-box" />
        </div>
        <div id="mall-footer" class="ui-footer">
            <span id="mall-total" class="ui-status" />
            <button id="mall-purchases" class="default ui-compact" onclick="purchases">View purchases</button>
            <button id="mall-refresh" class="default ui-compact" onclick="refresh">Refresh</button>
            <button id="mall-buy-points" class="default ui-compact" onclick="buy-points">Buy Points</button>
        </div>
    </div>
    <!-- Keep these terms aligned with the shop's Early Access Premium offering. -->
    <div id="mall-premium-info">
        <button id="mall-premium-back" class="default ui-compact" data-premium="close">Back to Item Mall</button>
        <h1>ROSE Premium</h1>
        <div class="premium-intro">More room for your adventures. All benefits apply to every character on your account.</div>
        <div class="premium-benefit content-box">
            <b>5 additional character slots</b>
            <div>Create up to 10 characters on your account instead of 5. Try more classes and keep your existing characters.</div>
        </div>
        <div class="premium-benefit content-box">
            <b>Premium Storage</b>
            <div>Running out of room for loot? Unlock the Premium Storage tab for extra space to store your items.</div>
        </div>
        <div class="premium-benefit content-box">
            <b>Remote Storage</b>
            <div>Access your storage from anywhere. Put away loot or pick up another equipment set without returning to a storage NPC.</div>
        </div>
        <div class="premium-terms">
            <b>If your subscription expires</b>
            <div>You can still play your additional characters, but characters deleted from Premium slots cannot be replaced without Premium.</div>
            <div>You can still withdraw items from Premium Storage, but cannot deposit new items. Remote Storage requires active Premium.</div>
        </div>
        <div class="premium-terms">Benefits activate the next time you log in. These are the Early Access Premium benefits; offerings may evolve. See the shop for current plans and pricing.</div>
        <button id="mall-premium-shop" class="default" onclick="buy-points">View plans in shop</button>
    </div>
</body>
</rml>
