<rml>
    <head>
        <title>Personal Store</title>
        <link type="text/template" href="../templates/window-fixed-size.html" />
        <link type="text/rcss" href="../styles/spritesheet_itemicon.css" />
        <link type="text/rcss" href="../styles/spritesheet_socketgem.css" />
        <link type="text/rcss" href="../styles/item_slot.css" />
        <style>
            body { width: 218dp; max-width: 96vw; }
            #game-avatar-store #window-content { height: auto; padding: 4dp; max-height: 80vh; overflow: auto; }
            #window-title-text { padding-right: 26dp; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
            #store-company { color: #ccc; margin-bottom: 6dp; word-break: break-word; }
            .shop-grid { display: flex; flex-wrap: wrap; width: 210dp; gap: 2dp; justify-content: center; }
            .shop-grid item-slot { width: 40dp; height: 40dp; flex: 0 0 40dp; }
            .shop-grid item-slot.selected { box-shadow: 0 0 0 1dp yellow; }
            #store-state { color: #ccc; word-break: break-word; margin: 4dp 0 0; }
            .shop-actions { display: flex; justify-content: center; margin-top: 4dp; }
            .shop-actions button { min-width: 84dp; }
        </style>
    </head>
    <body open-sound="5" close-sound="4" id="game-avatar-store" template="window-fixed-size">
        <div data-model="avatar-store">
        <div id="store-company" data-if="company != ''">{{ company }}</div>
        <div class="ui-tab-strip">
            <tab id="sell-tab" class="ui-tab" onclick="sell" data-class-active="!buy">Sell</tab>
            <tab id="buy-tab" class="ui-tab" onclick="buy" data-class-active="buy">Buy</tab>
        </div>
        <div id="sell-panel" class="shop-grid" data-if="!buy">
